<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풀무원 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <!-- Pretendard Variable 폰트 -->
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css?v=20261028-4">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <div class="utility-nav" aria-label="보조 메뉴">
                    <a href="#login">로그인</a>
                    <a href="#customer">고객센터</a>
                    <a href="#notice">공지사항</a>
                </div>
                <div class="header-main">
                    <a class="brand-logo" href="#top" aria-label="풀무원 홈"><img src="img/logo.gif" alt="Pulmuone 풀무원 로고"></a>
                    <nav class="main-nav" aria-label="주요 메뉴">
                        <a href="#food">바른먹거리</a>
                        <a href="#news">뉴스룸</a>
                        <a href="#company">회사소개</a>
                    </nav>
                    <div class="language-switch" aria-label="언어 선택">
                        <button type="button" class="language-button current" lang="ko" aria-pressed="true">KR</button><span class="slash">/</span><button type="button" class="language-button" lang="en" aria-pressed="false">EN</button>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/Frame 6.png" alt="풀풀" class="pc">
                            <img src="img/m_visual02.jpg" alt="모바일풀풀" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/Frame 633072.png" alt="푸릇푸릇" class="pc">
                            <img src="img/m_visual02.jpg" alt="모바일푸릇푸릇" class="mo">
                        </div>
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,
            pagination: {
                el: '.visual .swiper-pagination',
            },
        });
    </script>

    <script>
        document.querySelectorAll('.language-button').forEach((button) => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.language-button').forEach((item) => {
                    const selected = item === button;
                    item.classList.toggle('current', selected);
                    item.setAttribute('aria-pressed', String(selected));
                });
            });
        });
    </script>

</body>
</html>
